# Toolchain-free quality gate: formatting, Python lint, shell lint, spelling, and file hygiene,
# pinned by .pre-commit-config.yaml. Compiler warnings, clang-tidy, and GPU tests need the CUDA
# builder and run locally; see docs/maintainer/code-quality.md.
name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit==4.6.2
      - run: pre-commit run --all-files --show-diff-on-failure
